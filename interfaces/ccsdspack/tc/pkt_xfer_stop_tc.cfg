ccsds_segmented:bool=false

define_secondary_header:bool=true
secondary_header_type:string=PUS:revC:TC
secondary_header_spare_octets:int=0
pus_service_type:uint=220
pus_service_subtype:uint=2
pus_acknowledgement_flags:uint=0x9
pus_source_id:uint=0x0001
